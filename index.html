<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Skin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logotipo.jpg" alt="Logotipo Shine Skin" class="logo">
    </header>

    <nav class="categorias">
        <ul>
            <li><a href="#">Skincare</a></li>
            <li><a href="#">Limpeza Facial</a></li>
            <li><a href="#">Hidratantes</a></li>
            <li><a href="#">Protetor Solar</a></li>
        </ul>
    </nav>

    <section class="produtos">
        <h2>Produtos em Destaque</h2>
        <div class="grid">
            <div class="card">
                <img src="serum.jpg" alt="Sérum Facial" class="img-produto">
                <h3>Sérum Facial</h3>
                <p class="preco">R$ 49,90</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <div class="card">
                <img src="limpeza.jpg" alt="Gel de Limpeza" class="img-produto">
                <h3>Gel de Limpeza</h3>
                <p class="preco">R$ 35,00</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <div class="card">
                <img src="creme.jpg" alt="Creme Hidratante" class="img-produto">
                <h3>Creme Hidratante</h3>
                <p class="preco">R$ 55,90</p>
                <button class="btn-comprar">Comprar</button>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Shine Skin - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
