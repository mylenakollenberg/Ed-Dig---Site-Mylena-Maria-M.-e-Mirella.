<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shine Skin | Sua Pele Radiante</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho com Menu -->
  <header class="header">
    <h1 class="logo">Shine Skin</h1>
    <nav>
      <a href="#produtos">Produtos</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <!-- Banner Principal de Destaque -->
  <section class="hero">
    <h2>Cuidados Especiais para a Sua Pele</h2>
    <p>Descubra a nossa linha completa de cosméticos e tratamentos faciais.</p>
  </section>

  <!-- Seção das Categorias e Produtos -->
  <main id="produtos" class="container">
    <h2 class="titulo-secao">Nossas Categorias</h2>
    
    <section class="produtos-grid">
      
      <div class="card-produto">
        <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500&auto=format&fit=crop&q=80" alt="Peles Sensíveis">
        <h3>Peles Sensíveis</h3>
      </div>

      <div class="card-produto">
        <img src="https://images.unsplash.com/photo-1567928269937-25e40a0494df?w=500&auto=format&fit=crop&q=80" alt="Esfoliante e Diminuidor">
        <h3>Esfoliante e Diminuidor</h3>
      </div>

      <div class="card-produto">
        <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=80" alt="Hidratação e Proteção">
        <h3>Hidratação e Proteção</h3>
      </div>

      <div class="card-produto">
        <img src="https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=500&auto=format&fit=crop&q=80" alt="Limpeza Facial">
        <h3>Limpeza Facial</h3>
      </div>

    </section>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <p>&copy; Shine Skin - Todos os direitos reservados.</p>
  </footer>

</body>
</html>
