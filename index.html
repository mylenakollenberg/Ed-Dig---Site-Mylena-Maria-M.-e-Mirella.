<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Skin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <img src="logotipo.jpg" alt="Logotipo Shine Skin" class="logo">
        <h1 class="titulo">Shine Skin</h1>
    </header>

    <div class="secao-categorias">
        <h2 class="subtitulo">Categorias</h2>
        <div class="lista-categorias">
            <a href="#" class="btn-categoria">Skincare</a>
            <a href="#" class="btn-categoria">Limpeza Facial</a>
            <a href="#" class="btn-categoria">Hidratantes</a>
            <a href="#" class="btn-categoria">Protetor Solar</a>
        </div>
    </div>

    <main class="secao-produtos">
        <h2 class="subtitulo">Produtos em Destaque</h2>
        <div class="grid-produtos">
            <div class="card-produto">
                <h3>Sérum Facial</h3>
                <p class="preco">R$ 49,90</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <div class="card-produto">
                <h3>Gel de Limpeza</h3>
                <p class="preco">R$ 35,00</p>
                <button class="btn-comprar">Comprar</button>
            </div>
            <div class="card-produto">
                <h3>Creme Hidratante</h3>
                <p class="preco">R$ 55,90</p>
                <button class="btn-comprar">Comprar</button>
            </div>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Shine Skin - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
